name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write # publish-jupyter: PyPI trusted publishing

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node

  # The tag release-please pushes with GITHUB_TOKEN triggers no workflow of its
  # own, so the jupyter-gridlook wheel is built and published from here, at the
  # same version as the viewer (jupyter/pyproject.toml reads it from package.json).
  build-jupyter:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: read
    uses: ./.github/workflows/jupyter.yml

  # Publish here, not inside jupyter.yml: PyPI verifies the upload's attestation
  # against the top-level workflow, so the trusted publisher is bound to release.yml.
  publish-jupyter:
    # Wheel only: the sdist is source-only and cannot build itself (README).
    needs: build-jupyter
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jupyter-gridlook-wheel
          path: dist

      - name: Publish to PyPI (trusted publishing, no token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
