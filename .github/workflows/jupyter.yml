name: Jupyter

on:
  push:
    branches:
      - main
    paths:
      - "jupyter/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/jupyter.yml"
  pull_request:
    paths:
      - "jupyter/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/jupyter.yml"
  # release.yml calls this on a release to publish the wheel; PyPI's trusted
  # publisher is bound to this workflow file, so the publish job lives here.
  workflow_call:
    inputs:
      publish:
        description: Upload the built wheel to PyPI
        type: boolean
        default: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          # No uv.lock is checked in: key uv's cache on the build requirements instead.
          cache-dependency-glob: jupyter/pyproject.toml

      - name: Create a fresh venv outside the checkout
        # Outside on purpose: the repo root package.json declares "type": "module",
        # and node would load jlpm's bundled yarn.js as ESM (and fail) from a venv
        # nested under it. uv's isolated build env for the wheel is elsewhere already.
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/venv"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Build the wheel (runs the vite and jlpm build hooks)
        run: uv build --wheel jupyter -o jupyter/dist-py

      - name: Assert the wheel carries the SPA
        run: unzip -l jupyter/dist-py/*.whl | grep -q "jupyter_gridlook/static/index.html"

      - name: Assert the wheel carries the prebuilt labextension
        run: |
          listing=$(unzip -l jupyter/dist-py/*.whl)
          echo "$listing" | grep -q "share/jupyter/labextensions/jupyter-gridlook/package.json"
          echo "$listing" | grep -q "share/jupyter/labextensions/jupyter-gridlook/install.json"
          echo "$listing" | grep -q "share/jupyter/labextensions/jupyter-gridlook/static/remoteEntry\."

      - name: Assert the wheel ships no source maps
        run: "! unzip -l jupyter/dist-py/*.whl | grep -q '\\.map$'"

      - name: Keep the wheel for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: jupyter-gridlook-wheel
          path: jupyter/dist-py/*.whl

      - name: Install the wheel with jupyterlab and test deps
        run: uv pip install "$(ls jupyter/dist-py/*.whl)[test]" "jupyterlab>=4" ruff

      - name: Assert a development labextension build never ships
        # The README's dev loop (`jlpm build`) leaves source maps and build_log.json
        # in the labextension output. With sources present the hook rebuilds; with
        # sources absent (the prebuilt path) it strips them. Exercise both.
        run: |
          (cd jupyter/labextension && jlpm build)
          ls jupyter/jupyter_gridlook/labextension/build_log.json
          # pyproject.toml reads the version from ../package.json: keep one beside the copy.
          rsync -a --exclude node_modules jupyter/ "$RUNNER_TEMP/prebuilt/jupyter/"
          cp package.json "$RUNNER_TEMP/prebuilt/"
          rm "$RUNNER_TEMP/prebuilt/jupyter/labextension/package.json"
          uv build --wheel jupyter -o "$RUNNER_TEMP/rebuilt"
          uv build --wheel "$RUNNER_TEMP/prebuilt/jupyter" -o "$RUNNER_TEMP/prebuilt-dist"
          for whl in "$RUNNER_TEMP"/rebuilt/*.whl "$RUNNER_TEMP"/prebuilt-dist/*.whl; do
            listing=$(unzip -l "$whl")
            echo "$listing" | grep -q "jupyter-gridlook/static/remoteEntry\."
            ! echo "$listing" | grep -qE '\.map$|build_log\.json$'
          done

      - name: Assert both halves are enabled on install
        run: |
          # enabled AND validated: `OK` is the part that proves each half loads
          servers=$(jupyter server extension list 2>&1) && echo "$servers"
          echo "$servers" | grep -E "jupyter_gridlook .*enabled"
          echo "$servers" | grep -E "jupyter_gridlook [0-9.]+ .*OK"
          jupyter labextension list 2>&1 | tee /dev/stderr | grep -E "jupyter-gridlook v[0-9.]+ .*enabled.*OK"

      - name: Ruff
        run: |
          ruff check jupyter/jupyter_gridlook jupyter/tests jupyter/hatch_build.py
          ruff format --check jupyter/jupyter_gridlook jupyter/tests jupyter/hatch_build.py

      - name: Pytest
        run: pytest jupyter/tests -v

      - name: Jest (labextension helpers)
        working-directory: jupyter/labextension
        run: |
          jlpm install
          jlpm test

      - name: Assert the sdist carries sources only
        # After the jlpm install above, labextension/node_modules is present: the
        # sdist must still leave it (and the tsc outputs) out.
        run: |
          uv build --sdist jupyter -o "$RUNNER_TEMP/sdist"
          listing=$(tar tzf "$RUNNER_TEMP"/sdist/*.tar.gz)
          echo "$listing"
          if echo "$listing" | grep -E 'node_modules/|tsbuildinfo$|labextension/lib/'; then
            echo "::error::the sdist ships build outputs" && exit 1
          fi
          test "$(echo "$listing" | wc -l)" -lt 100

  publish:
    # Wheel only: the sdist is source-only and cannot build itself (README).
    if: inputs.publish
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jupyter-gridlook-wheel
          path: dist

      - name: Publish to PyPI (trusted publishing, no token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
