[build-system]
# jupyterlab is build-time only: it provides jlpm / `jupyter labextension build`
# for the Lab extension half (hatch_build.py). Runtime deps stay below.
requires = ["hatchling", "jupyterlab>=4.0.0,<5"]
build-backend = "hatchling.build"

[project]
name = "gridlook-jupyter"
# Static for now; coupling it to gridlook releases is an open question (see the PR).
version = "0.1.0"
description = "Jupyter server extension serving the gridlook viewer with a streaming S3 byte-range proxy"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "gridlook contributors" }]
dependencies = [
    "boto3>=1.34",
    "jupyter-server>=2",
    "obstore>=0.11",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-jupyter[server]>=0.10",
]

[tool.hatch.build.targets.wheel]
packages = ["gridlook_jupyter"]
# The static SPA is copied in by the build hook and is gitignored; `artifacts`
# re-includes VCS-ignored paths.
artifacts = ["gridlook_jupyter/static/**"]

# Both halves enable themselves on install: the server extension through
# jupyter_server_config.d, the Lab extension as a prebuilt labextension (built
# into gridlook_jupyter/labextension/ by the hook) with its install.json.
[tool.hatch.build.targets.wheel.shared-data]
"jupyter-config/jupyter_server_config.d" = "etc/jupyter/jupyter_server_config.d"
"gridlook_jupyter/labextension" = "share/jupyter/labextensions/jupyterlab-gridlook"
"labextension/install.json" = "share/jupyter/labextensions/jupyterlab-gridlook/install.json"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# The sdist is source-only: it cannot build a wheel, because the build hook needs
# the gridlook frontend sources one directory up. Build wheels from a checkout.
[tool.hatch.build.targets.sdist]
include = [
    "gridlook_jupyter",
    "jupyter-config",
    "labextension",
    "hatch_build.py",
    "README.md",
]
# Hatch reads only this directory's .gitignore (not the repo root's), so name the
# jlpm install/tsc outputs explicitly: a wheel build runs `jlpm install` in labextension/.
exclude = [
    "labextension/node_modules",
    "labextension/lib",
    "labextension/tsconfig.tsbuildinfo",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
